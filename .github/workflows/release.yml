name: Build and release

# A new version is released whenever "version" in package.json changes on main.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Create draft release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          DRAFT=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then echo "Release $TAG already published, nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$DRAFT" = "none" ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Karaoke Lab $TAG" \
              --notes "Karaoke Lab $TAG — Windows installer (.exe) and macOS (.dmg: arm64 for Apple Silicon M1–M4, x64 for Intel)."
          fi

  build:
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            python: '3.12'
            torch: 'torch==2.6.0 torchaudio==2.6.0'
            torch_index: '--index-url https://download.pytorch.org/whl/cpu'
            numpy: 'numpy<2.3'
            ytdlp: yt-dlp.exe
            deno: deno-x86_64-pc-windows-msvc.zip
            builder: --win nsis --x64
          - name: mac-arm64
            os: macos-15
            python: '3.12'
            torch: 'torch==2.6.0 torchaudio==2.6.0'
            torch_index: ''
            numpy: 'numpy<2.3'
            ytdlp: yt-dlp_macos
            deno: deno-aarch64-apple-darwin.zip
            builder: --mac dmg --arm64
          - name: mac-x64
            os: macos-15-intel
            python: '3.11'
            torch: 'torch==2.2.2 torchaudio==2.2.2'
            torch_index: ''
            numpy: 'numpy<2'
            ytdlp: yt-dlp_macos
            deno: deno-x86_64-apple-darwin.zip
            builder: --mac dmg --x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.torch }} ${{ matrix.torch_index }}
          python -m pip install "${{ matrix.numpy }}" soundfile dora-search einops "julius>=0.2.3" openunmix pyyaml tqdm "pyinstaller>=6.6"
          python -m pip install --no-deps demucs==4.0.1

      - name: Download separation models
        run: |
          mkdir -p resources/models
          TORCH_HOME="$PWD/resources/models" python engine/sep_cli.py --warmup
          du -sh resources/models

      - name: Build separation engine (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name ks-separate \
            --distpath resources/engine --workpath build/pyi --specpath build/pyi \
            --collect-submodules demucs --collect-data demucs \
            --collect-all soundfile --collect-submodules julius --collect-submodules openunmix \
            --collect-submodules dora --collect-data omegaconf --hidden-import yaml \
            --hidden-import numpy.core.multiarray --collect-submodules numpy.core \
            engine/sep_cli.py
          du -sh resources/engine

      - name: Self-test the engine
        run: |
          EXE=resources/engine/ks-separate/ks-separate
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          TORCH_HOME="$PWD/resources/models" "$EXE" --selftest

      - name: Download yt-dlp and Deno
        run: |
          mkdir -p resources/bin
          if [ "${{ matrix.ytdlp }}" = "yt-dlp.exe" ]; then OUT=yt-dlp.exe; else OUT=yt-dlp; fi
          curl -fsSL -o "resources/bin/$OUT" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp }}"
          curl -fsSL -o deno.zip "https://github.com/denoland/deno/releases/latest/download/${{ matrix.deno }}"
          unzip -o deno.zip -d resources/bin && rm deno.zip
          chmod +x resources/bin/* || true
          ls -la resources/bin
          "resources/bin/$OUT" --version

      - name: Build app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder ${{ matrix.builder }} --publish never
          ls -la dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FILES=(dist/*.exe dist/*.exe.blockmap dist/*.dmg)
          if [ -f dist/latest.yml ]; then FILES+=(dist/latest.yml); fi
          echo "Uploading: ${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber -R "$GITHUB_REPOSITORY"

  publish:
    needs: [create-release, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest -R "$GITHUB_REPOSITORY"
