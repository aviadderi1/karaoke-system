name: websearch-check
on: workflow_dispatch
jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: |
          curl -s -D - -o o1.json "https://api.openverse.org/v1/images/?q=sunset%20beach&page=1&page_size=20&aspect_ratio=wide&mature=false" -A "KaraokeLab/1.0.11 (desktop karaoke maker)" | head -20; head -c 800 o1.json; echo
          curl -s -o o2.json -w "%{http_code}\n" "https://api.openverse.org/v1/images/?q=sunset%20beach&page_size=20"; head -c 300 o2.json; echo
      - name: node fetch through server.js
        run: |
          npm i --no-save --ignore-scripts electron-updater >/dev/null 2>&1 || true
          node -e "
          fetch('https://api.openverse.org/v1/images/?q=sunset%20beach&page=1&page_size=20&aspect_ratio=wide&mature=false',{headers:{'User-Agent':'KaraokeLab/1.0.11 (desktop karaoke maker)'}}).then(async r=>{console.log('status',r.status);const t=await r.text();console.log(t.slice(0,400))}).catch(e=>console.log('ERR',e))"
