name: speed
on: workflow_dispatch
jobs:
  speed:
    strategy:
      fail-fast: false
      matrix:
        mode: ["0.25", "0.1"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy<2.3" soundfile dora-search einops "julius>=0.2.3" openunmix pyyaml tqdm uroman certifi
          python -m pip install --no-deps demucs==4.0.1
      - run: |
          gh release download models-v1 -p mms_fa_model.pt -D "$RUNNER_TEMP/mms" && mv "$RUNNER_TEMP/mms/mms_fa_model.pt" "$RUNNER_TEMP/mms/model.pt"
          gh release download v1.0.4 -p '*.exe' -O prev.exe && 7z x -y prev.exe -ox >/dev/null && 7z x -y "$(ls x/\$PLUGINSDIR/app-64.7z)" -oapp >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
      - run: TORCH_HOME="$PWD/app/resources/models" MMS_DIR="$RUNNER_TEMP/mms" python engine/speed_bench.py ${{ matrix.mode }}
