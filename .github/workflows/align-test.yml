name: Align engine test
on:
  push:
    branches: [align-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy<2" soundfile uroman
      - name: Model source
        run: python -c "import torchaudio,inspect;b=torchaudio.pipelines.MMS_FA;print(b._path);import torchaudio.pipelines._wav2vec2.impl as m;print(inspect.getsource(m.Wav2Vec2Bundle._get_state_dict))"
      - name: Self-test
        run: cd engine && python sep_cli.py --align-selftest --models /tmp/mms
