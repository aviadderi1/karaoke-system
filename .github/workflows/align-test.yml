name: Align engine test
on:
  push:
    branches: [align-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy<2" soundfile uroman certifi dora-search einops "julius>=0.2.3" openunmix pyyaml tqdm
          python -m pip install --no-deps demucs==4.0.1
      - name: Self-test
        run: cd engine && python sep_cli.py --align-selftest --models /tmp/mms
      - name: Benchmark over music (separation + alignment)
        run: cd engine && time python align_bench.py
