<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Karaoke Lab</title>
<style>
html,body{margin:0;height:100%;background:#07040f;overflow:hidden;user-select:none;-webkit-app-region:drag;cursor:default;font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%}
#meta{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:14px;color:#cfc6ff;font-size:12px;letter-spacing:2px;text-shadow:0 1px 6px #000}
#meta b{color:#fff;font-weight:600;min-width:38px;text-align:right}
#ver{position:absolute;right:14px;bottom:12px;color:#8f86b8;font-size:11px;font-family:Consolas,monospace}
#copy{position:absolute;left:14px;bottom:12px;color:#8f86b8;font-size:11px;letter-spacing:1px}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="meta"><span id="stp">PREPARING THE LAB</span><b id="pct">0%</b></div>
<div id="copy">© AD SOUND &amp; SERVICE</div><div id="ver"></div>
<script>
const DUR=10, PAINT0=0.5, PAINT1=9.5;            // seconds
const LX0=288, LX1=1150, LY=566;                  // letters span in the photo (pixels)
const v=new URLSearchParams(location.search).get('v');document.getElementById('ver').textContent=v?'v'+v:'';
const STEPS=['PREPARING THE LAB','MIXING THE COLORS','LOADING THE ENGINE','TUNING THE MICROPHONES','READY'];
let override=null;window.ksStatus=m=>{override=String(m).toUpperCase();setTimeout(()=>override=null,900)};
const cv=document.getElementById('c'),c=cv.getContext('2d');
const img=new Image(),mask=new Image();let IW=0,IH=0,plain,painted,edge,tmp,parts=[],ready=0;
img.src='build/splash.jpg';mask.src='build/letters_mask.png';
[img,mask].forEach(i=>i.onload=()=>{if(++ready===2)prep()});
function mk(w,h){const x=document.createElement('canvas');x.width=w;x.height=h;return x}
function prep(){IW=img.naturalWidth;IH=img.naturalHeight;
 // letters only (alpha from mask)
 const L=mk(IW,IH),l=L.getContext('2d');l.drawImage(img,0,0);l.globalCompositeOperation='destination-in';l.drawImage(mask,0,0);
 // unpainted: grey plaster letters
 plain=mk(IW,IH);const p=plain.getContext('2d');p.drawImage(img,0,0);
 const G=mk(IW,IH),g=G.getContext('2d');g.filter='grayscale(1) brightness(.62) contrast(1.15)';g.drawImage(L,0,0);g.filter='none';
 p.drawImage(G,0,0);
 // painted: vivid gradient colors + glow
 painted=mk(IW,IH);const q=painted.getContext('2d');q.drawImage(img,0,0);
 const T=mk(IW,IH),t=T.getContext('2d');const gr=t.createLinearGradient(LX0,0,LX1,0);gr.addColorStop(0,'#22d3ee');gr.addColorStop(.5,'#8b5cf6');gr.addColorStop(1,'#ec4899');
 t.fillStyle=gr;t.fillRect(0,0,IW,IH);t.globalCompositeOperation='destination-in';t.drawImage(mask,0,0);
 q.globalCompositeOperation='multiply';q.globalAlpha=.92;q.drawImage(T,0,0);q.globalCompositeOperation='screen';q.globalAlpha=.22;q.drawImage(T,0,0);
 q.globalCompositeOperation='source-over';q.globalAlpha=1;q.filter='blur(10px)';q.globalCompositeOperation='screen';q.globalAlpha=.45;q.drawImage(T,0,0);q.filter='none';q.globalAlpha=1;q.globalCompositeOperation='source-over';
 edge=mk(IW,IH);tmp=mk(IW,IH);
 resize();requestAnimationFrame(frame)}
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);
const t0=performance.now();let lastT=0;
function frame(now){draw(window.__T!=null?window.__T:(now-t0)/1000);requestAnimationFrame(frame)}
function draw(t){if(!IW)return;const W=cv.width,H=cv.height;const s=Math.max(W/IW,H/IH),dw=IW*s,dh=IH*s,ox=(W-dw)/2,oy=(H-dh)/2;
 const p=Math.min(1,Math.max(0,(t-PAINT0)/(PAINT1-PAINT0)));const ease=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;const wx=LX0-30+(LX1-LX0+60)*ease;
 // build feathered reveal of the painted image
 const e=edge.getContext('2d');e.clearRect(0,0,IW,IH);const fg=e.createLinearGradient(wx-46,0,wx,0);fg.addColorStop(0,'rgba(0,0,0,1)');fg.addColorStop(1,'rgba(0,0,0,0)');e.fillStyle='#000';e.fillRect(0,0,Math.max(0,wx-46),IH);e.fillStyle=fg;e.fillRect(wx-46,0,46,IH);
 const m=tmp.getContext('2d');m.clearRect(0,0,IW,IH);m.globalCompositeOperation='source-over';m.drawImage(painted,0,0);m.globalCompositeOperation='destination-in';m.drawImage(edge,0,0);m.globalCompositeOperation='source-over';
 c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);
 // slow cinematic push-in
 const z=1+0.035*Math.min(1,t/DUR);c.setTransform(z,0,0,z,W/2*(1-z),H/2*(1-z));
 c.drawImage(plain,ox,oy,dw,dh);c.drawImage(tmp,ox,oy,dw,dh);
 // brush glow + sparks at the paint edge
 if(p>0&&p<1){const X=ox+wx*s,Y=oy+LY*s;const rg=c.createRadialGradient(X,Y,0,X,Y,90*s);rg.addColorStop(0,'rgba(255,255,255,.55)');rg.addColorStop(.3,'rgba(160,120,255,.35)');rg.addColorStop(1,'rgba(160,120,255,0)');c.globalCompositeOperation='screen';c.fillStyle=rg;c.fillRect(X-100*s,Y-100*s,200*s,200*s);
  if(Math.random()<.9)for(let i=0;i<3;i++)parts.push({x:wx+(Math.random()-.5)*10,y:LY+(Math.random()-.5)*110,vx:(Math.random()-.2)*40,vy:-20-Math.random()*50,l:1,h:Math.random()});c.globalCompositeOperation='source-over'}
 const dt=Math.max(0,Math.min(.05,t-lastT));lastT=t;c.globalCompositeOperation='screen';
 parts=parts.filter(q=>(q.l-=dt*1.1)>0);for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;const col=q.h<.33?'34,211,238':q.h<.66?'139,92,246':'236,72,153';c.fillStyle=`rgba(${col},${q.l})`;c.beginPath();c.arc(ox+q.x*s,oy+q.y*s,(1.2+2*q.l)*s*1.4,0,7);c.fill()}
 c.globalCompositeOperation='source-over';c.setTransform(1,0,0,1,0,0);
 // vignette + fade-in
 const vg=c.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.5,W*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');c.fillStyle=vg;c.fillRect(0,0,W,H);
 if(t<0.6){c.fillStyle=`rgba(7,4,15,${1-t/0.6})`;c.fillRect(0,0,W,H)}
 document.getElementById('pct').textContent=Math.round(p*100)+'%';document.getElementById('stp').textContent=override||STEPS[Math.min(STEPS.length-1,Math.floor(p*(STEPS.length-1)+1e-4))]}
</script></body></html>
