<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Karaoke System</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#07040f;overflow:hidden;font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif;user-select:none;-webkit-app-region:drag;cursor:default}
canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#logo{width:112px;height:112px;opacity:0;transform:scale(.55) rotate(-12deg);transition:transform 1.1s cubic-bezier(.2,1.5,.35,1),opacity .6s;filter:drop-shadow(0 0 18px rgba(63,180,255,.55))}
#logo.on{opacity:1;transform:scale(1) rotate(0)}
#ttl{margin-top:14px;font-size:40px;font-weight:900;letter-spacing:9px;color:#fff;opacity:0;transform:translateY(10px);transition:all .9s .35s;text-shadow:0 0 24px rgba(63,180,255,.35)}
#ttl b{background:linear-gradient(90deg,#3fb4ff,#b04dff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
#sub{font-size:11px;letter-spacing:6px;color:#9a8fc0;margin-top:6px;opacity:0;transition:opacity .9s .7s;font-weight:500}
.on2{opacity:1!important;transform:none!important}
#load{margin-top:40px;width:66%;opacity:0;transition:opacity .6s .9s}
#dots{display:flex;gap:9px;height:12px;margin:0 0 10px 2px}
#dots span{width:12px;height:12px;border-radius:50%;background:#3fb4ff;box-shadow:0 0 10px #3fb4ff;transition:transform .25s,opacity .25s}
#dots span.out{transform:scale(0);opacity:0}
#line{position:relative;font-size:24px;font-weight:800;white-space:nowrap;text-align:center;letter-spacing:1px}
#line .a{color:#fff;-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:3px 3px 4px rgba(0,0,0,.7)}
#line .b{position:absolute;left:0;right:0;top:0;color:#3fb4ff;-webkit-text-stroke:1px #000;paint-order:stroke fill;clip-path:inset(0 100% 0 0);text-shadow:0 0 14px rgba(63,180,255,.6)}
#barw{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:14px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#3fb4ff,#b04dff);box-shadow:0 0 10px #3fb4ff}
#meta{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:#8a80ad;font-family:'JetBrains Mono',Consolas,monospace}
#ver{position:absolute;right:14px;bottom:10px;font-size:10px;color:#5d567a;font-family:'JetBrains Mono',Consolas,monospace}
#copy{position:absolute;left:14px;bottom:10px;font-size:10px;color:#5d567a;letter-spacing:1px}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
 <svg id="logo" viewBox="0 0 120 120"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb4ff"/><stop offset="1" stop-color="#b04dff"/></linearGradient></defs>
  <circle cx="60" cy="60" r="55" fill="#0d0820" stroke="url(#g1)" stroke-width="4"/>
  <rect x="46" y="22" width="28" height="46" rx="14" fill="url(#g1)"/>
  <g stroke="#ffffff55" stroke-width="2"><line x1="50" y1="32" x2="70" y2="32"/><line x1="49" y1="40" x2="71" y2="40"/><line x1="49" y1="48" x2="71" y2="48"/></g>
  <path d="M36 57 a24 24 0 0 0 48 0" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="60" y1="81" x2="60" y2="94" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="47" y1="96" x2="73" y2="96" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg>
 <div id="ttl">KARAOKE <b>SYSTEM</b></div>
 <div id="sub">AD SOUND &amp; SERVICE</div>
 <div id="load">
  <div id="dots"><span></span><span></span><span></span><span></span></div>
  <div id="line"><span class="a">Loading your stage…</span><span class="b" id="wipe">Loading your stage…</span></div>
  <div id="barw"><div id="bar"></div></div>
  <div id="meta"><span id="stp">Starting audio engine</span><span id="pct">0%</span></div>
 </div>
</div>
<div id="copy">© AD SOUND &amp; SERVICE</div><div id="ver"></div>
<script>
const v=new URLSearchParams(location.search).get('v');document.getElementById('ver').textContent=v?'v'+v:'';
const cv=document.getElementById('c'),c=cv.getContext('2d');let W,H;function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}rs();addEventListener('resize',rs);
const STEPS=['Starting audio engine','Loading separation models','Preparing YouTube tools','Tuning the spotlights','Ready'];let override=null;window.ksStatus=m=>{override=m;setTimeout(()=>override=null,900)};
const t0=performance.now(),DUR=7,CD=1.4;
setTimeout(()=>document.getElementById('logo').classList.add('on'),80);setTimeout(()=>{['ttl','sub','load'].forEach(i=>document.getElementById(i).classList.add('on2'))},120);
const dots=[...document.querySelectorAll('#dots span')];
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function frame(now){const t=(now-t0)/1000,p=Math.min(1,Math.max(0,(t-CD)/(DUR-CD-0.2)));
 c.fillStyle='#07040f';c.fillRect(0,0,W,H);
 c.globalCompositeOperation='lighter';
 for(let i=0;i<4;i++){const x=W*(0.5+0.42*Math.sin(t*0.55+i*1.7)),col=i%2?'176,77,255':'63,180,255';const g=c.createLinearGradient(x,0,x,H);g.addColorStop(0,`rgba(${col},.32)`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.moveTo(x-W*.02,-10);c.lineTo(x-W*.22,H);c.lineTo(x+W*.22,H);c.lineTo(x+W*.02,-10);c.fill()}
 const glow=c.createRadialGradient(W/2,H*.42,0,W/2,H*.42,W*.45);glow.addColorStop(0,'rgba(90,60,200,.25)');glow.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=glow;c.fillRect(0,0,W,H);
 for(let i=0;i<90;i++){const r=rnd(i),y=((rnd(i+3)*H-t*H*0.04*(0.4+r))%H+H)%H,x=rnd(i+7)*W;c.fillStyle=`rgba(${i%3?'200,220,255':'190,140,255'},${0.15+0.55*r*(0.6+0.4*Math.sin(t*3+i))})`;c.beginPath();c.arc(x,y,(0.6+r*1.6)*devicePixelRatio,0,7);c.fill()}
 const n=64,bw=W/n,lvl=0.25+0.75*Math.min(1,t/1.2);for(let i=0;i<n;i++){const h=H*0.16*lvl*(0.25+0.75*Math.abs(Math.sin(t*(2.2+rnd(i)*3)+i*0.7))*(0.5+0.5*Math.sin(i/n*Math.PI)));const g=c.createLinearGradient(0,H,0,H-h);g.addColorStop(0,'rgba(63,180,255,.45)');g.addColorStop(1,'rgba(176,77,255,.05)');c.fillStyle=g;c.fillRect(i*bw+bw*.2,H-h,bw*.6,h)}
 c.globalCompositeOperation='source-over';
 const vg=c.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.7)');c.fillStyle=vg;c.fillRect(0,0,W,H);
 const left=t<CD?Math.ceil((CD-t)/(CD/4)):0;dots.forEach((d,i)=>d.classList.toggle('out',i>=left));
 document.getElementById('wipe').style.clipPath=`inset(0 ${(100-p*100).toFixed(2)}% 0 0)`;document.getElementById('bar').style.width=(p*100)+'%';document.getElementById('pct').textContent=Math.round(p*100)+'%';
 document.getElementById('stp').textContent=override||STEPS[Math.min(STEPS.length-1,Math.floor(p*(STEPS.length-1)+1e-4))];
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
